{% for livre in livres %}
<div class="card">
  <img src="{{ livre.couverture.url }}" alt="..." />
  <h5>{{ livre.titre }}</h5>
  <p>{{ livre.auteur }}</p>
  <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#reservationModal{{ livre.id }}">
    Réserver
  </button>
</div>

<!-- Modal ki konekte ak liv sa -->
<div class="modal fade animate__animated animate__fadeInDown" id="reservationModal{{ livre.id }}" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content shadow-lg border-0 rounded-4 animate__animated animate__zoomIn animate__faster">
      <div class="modal-header bg-primary text-white rounded-top-4">
        <h5 class="modal-title fw-bold"><i class="fas fa-bookmark me-2"></i>Confirmer votre réservation</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body bg-light">
        <div class="d-flex align-items-center mb-3">
          <img src="{{ livre.couverture.url }}" alt="Couverture"
               class="rounded shadow-sm me-3 animate__animated animate__fadeInLeft animate__faster"
               style="width: 90px; height: 130px; object-fit: cover;">
          <div>
            <h5 class="fw-semibold text-primary">{{ livre.titre }}</h5>
            <p class="text-muted mb-0"><i class="fas fa-user-edit me-1"></i>{{ livre.auteur }}</p>
          </div>
        </div>

        <form method="post" id="reservationForm{{ livre.id }}">
          {% csrf_token %}
          <input type="hidden" name="livre_id" value="{{ livre.id }}">
          <div class="mb-3">
            <label class="form-label fw-semibold">Type de réservation</label>
            {{ form.type_reservation }}
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Message (facultatif)</label>
            {{ form.message_utilisateur }}
          </div>
          <button type="submit" class="btn btn-primary w-100 fw-semibold animate__animated animate__pulse animate__infinite">
            <i class="fas fa-paper-plane me-2"></i>Soumettre
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endfor %}
