{% load static %}
<footer class="py-4 bg-light mt-auto">
                    <div class="container-fluid px-4">
                        <div class="d-flex align-items-center justify-content-between small">
                            <div class="text-muted">  </div>
                            <div>
                                <a href="#"></a>
                                &middot;
                                <a href="#"></a>
                            </div>
                        </div>
                    </div>
                </footer>
            </div>
        </div>
        
        <script src="{% static 'js/scripts.js' %}"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.8.0/Chart.min.js" crossorigin="anonymous"></script>
        <script src="{% static 'assets/demo/chart-area-demo.js' %}"></script>
        <script src="{% static 'assets/demo/chart-bar-demo.js' %}"></script>
        <script src="https://cdn.jsdelivr.net/npm/simple-datatables@latest" crossorigin="anonymous"></script>
        <script src="{% static 'js/datatables-simple-demo.js' %}"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>


      <script>
document.addEventListener("DOMContentLoaded", function () {

    const badge = document.getElementById("notif-badge");
    const dropdown = document.getElementById("notif-dropdown");
    const bell = document.getElementById("alertsDropdown");

    // 🔔 Rafraîchir compteur
    function refreshCount() {
        fetch("{% url 'compter_notifications' %}")
            .then(res => res.json())
            .then(data => {
                if (data.valeur_notif > 0) {
                    badge.textContent = data.valeur_notif;
                    badge.classList.remove("d-none");
                } else {
                    badge.classList.add("d-none");
                }
            });
    }

    // 📥 Charger notifications
    function loadNotifications() {
        dropdown.innerHTML = `
            <li class="dropdown-header">Notifications</li>
        `;

        fetch("{% url 'liste_notifications' %}")
            .then(res => res.json())
            .then(data => {
    dropdown.innerHTML =
        '<li class="dropdown-header">Notifications</li>';

    if (data.data.length === 0) {
        dropdown.innerHTML +=
            '<li class="dropdown-item text-muted">Aucune notification</li>';
    } else {
        data.data.forEach(n => {
            dropdown.innerHTML += `
                <li>
                    <a class="dropdown-item d-flex align-items-start" href="${n.link}">
                        <div class="me-2">
                            <i class="fas fa-check-circle text-success"></i>
                        </div>
                        <div>
                            <div class="small text-muted">${n.date_envoi}</div>
                            <div class="${n.lu ? '' : 'fw-bold'}">${n.titre}</div>
                            <div class="small text-gray-600">${n.message}</div>
                        </div>
                    </a>
                </li>`;
        });
    }
});

    }

    // ⏱️ Auto refresh toutes les 10s
    refreshCount();
    setInterval(refreshCount, 10000);

    // 👆 Charger au clic (MEILLEUR que hover)
    bell.addEventListener("click", loadNotifications);
});
</script>
