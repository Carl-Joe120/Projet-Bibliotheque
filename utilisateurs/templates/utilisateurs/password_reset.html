{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mot de passe oublié</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0a0a0a; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .reset-card {
            background: rgba(255,255,255,0.97);
            border-radius: 24px;
            padding: 3rem;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
        }
        .logo { text-align: center; margin-bottom: 2rem; }
        .logo img { height: 80px; }
        h2 {
            font-size: 1.8rem; font-weight: 800; text-align: center;
            background: linear-gradient(135deg, #1565c0, #0d47a1);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        .subtitle { text-align: center; color: #666; margin-bottom: 2rem; font-size: 0.95rem; }
        label { font-weight: 600; color: #333; margin-bottom: 0.5rem; display: block; font-size: 0.9rem; }
        input[type="email"] {
            width: 100%; padding: 1rem 1.2rem;
            border: 2px solid rgba(21,101,192,0.2); border-radius: 12px;
            font-size: 1rem; font-family: inherit;
            transition: all 0.3s ease;
        }
        input[type="email"]:focus {
            outline: none; border-color: #1565c0;
            box-shadow: 0 0 0 4px rgba(21,101,192,0.1);
        }
        .btn-submit {
            width: 100%; padding: 1rem;
            background: linear-gradient(135deg, #1565c0, #0d47a1);
            color: white; border: none; border-radius: 12px;
            font-size: 1rem; font-weight: 600; cursor: pointer;
            margin-top: 1.5rem; transition: all 0.3s ease;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(21,101,192,0.4); }
        .back-link { text-align: center; margin-top: 1.5rem; }
        .back-link a { color: #1565c0; text-decoration: none; font-weight: 500; font-size: 0.9rem; }
        .back-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="reset-card">
        <div class="logo">
            <img src="/static/img/photos/logo_biblio.png" alt="Logo">
        </div>
        <h2>Mot de passe oublié ?</h2>
        <p class="subtitle">Entrez votre email — nous vous enverrons un lien de réinitialisation.</p>

        <form method="POST">
            {% csrf_token %}
            <label for="id_email">Adresse email</label>
            <input type="email" name="email" id="id_email"
                   placeholder="votre@email.com" required>
            <button type="submit" class="btn-submit">
                <i class="fas fa-paper-plane me-2"></i>Envoyer le lien
            </button>
        </form>

        <div class="back-link">
            <a href="{% url 'loginview' %}">
                <i class="fas fa-arrow-left me-1"></i>Retour à la connexion
            </a>
        </div>
    </div>
</body>
</html>
