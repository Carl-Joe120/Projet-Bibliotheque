{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Email envoyé</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0a0a0a; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card {
            background: rgba(255,255,255,0.97); border-radius: 24px;
            padding: 3rem; width: 100%; max-width: 480px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3); text-align: center;
        }
        .icon-circle {
            width: 80px; height: 80px; border-radius: 50%;
            background: linear-gradient(135deg, #28a745, #20c997);
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 2rem; color: white; margin-bottom: 1.5rem;
        }
        h2 { font-size: 1.8rem; font-weight: 800; color: #212529; margin-bottom: 1rem; }
        p { color: #666; line-height: 1.6; margin-bottom: 2rem; }
        .btn-back {
            display: inline-block; padding: 0.875rem 2rem;
            background: linear-gradient(135deg, #1565c0, #0d47a1);
            color: white; border-radius: 12px; text-decoration: none;
            font-weight: 600; transition: all 0.3s ease;
        }
        .btn-back:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(21,101,192,0.4); color: white; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-circle">
            <i class="fas fa-envelope-open-text"></i>
        </div>
        <h2>Email envoyé !</h2>
        <p>
            Si un compte existe avec cette adresse email, vous recevrez
            un lien de réinitialisation dans quelques minutes.<br><br>
            Vérifiez aussi votre dossier <strong>spam</strong>.
        </p>
        <a href="{% url 'loginview' %}" class="btn-back">
            <i class="fas fa-arrow-left me-2"></i>Retour à la connexion
        </a>
    </div>
</body>
</html>
